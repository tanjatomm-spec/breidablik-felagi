<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  background:#f2f2f7;min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:20px;gap:16px;}
.card{width:340px;border-radius:18px;overflow:hidden;background:#006B43;
  color:white;box-shadow:0 8px 32px rgba(0,0,0,.25);}
.card-top{display:flex;align-items:center;gap:12px;padding:16px 20px 14px;

.logo{width:48px;height:60px;object-fit:contain;flex-shrink:0}
.club-name{font-size:17px;font-weight:600}
.club-sub{font-size:11px;opacity:.72;margin-top:2px}

.member-name{font-size:22px;font-weight:600;margin-bottom:8px}
.badge{display:inline-block;background:rgba(255,255,255,.2);border-radius:99px;
  font-size:12px;padding:3px 14px;margin-bottom:16px}
.meta{display:flex;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.ml{font-size:10px;opacity:.6;text-transform:uppercase;letter-spacing:.06em;display:block}
.mv{font-size:13px;font-weight:600;display:block}
.card-bottom{background:white;display:flex;align-items:center;
  justify-content:space-between;padding:12px 20px;gap:12px}
.barcode{flex:1}
.barcode-num{font-size:10px;color:#555;font-family:monospace;letter-spacing:.1em;margin-top:4px}
.qr-img{width:72px;height:72px}
.add-btn{width:340px;background:#006B43;color:white;border:none;border-radius:12px;
  padding:14px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;
  box-shadow:0 4px 14px rgba(0,107,67,.4)}
.add-btn:active{transform:scale(0.98)}
.hint{font-size:12px;color:#888;text-align:center;max-width:300px}
</style>

<button class="add-btn" onclick="addToHomeScreen()">＋ Bæta á heimaskjá</button>
<p class="hint">iPhone: Smelltu á 📤 og veldu „Bæta á heimaskjá"<br>Android: Smelltu á ⋮ og veldu „Add to Home screen"</p>

<script>
function addToHomeScreen() {
  // Android Chrome: beforeinstallprompt
  if (window.deferredPrompt) {
    window.deferredPrompt.prompt();
    window.deferredPrompt.userChoice.then(() => { window.deferredPrompt = null; });
  } else {
    alert('iPhone: Smelltu á deilihnappinn 📤 neðst í Safari og veldu "Bæta á heimaskjá"');
  }
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  window.deferredPrompt = e;
});
</script>
